[project]
name = "classification-exemples-shiny"
version = "0.1.0"
description = "Application Shiny for Python interactive pour explorer les algorithmes de classification automatique"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "shiny>=1.0.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "shinyswatch>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "pandas-stubs>=2.2.0",
]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Ignorer les imports manquants pour les bibliothèques sans stubs de type
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "plotly.*",
    "shiny.*",
    "shinyswatch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
